[project]
name = "mcp-mail"
version = "0.1.0"
description = "Self-hosted MCP server for unified email control across M365, Gmail, iCloud, Yahoo."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Numaco AG" },
]

dependencies = [
    "mcp>=1.2",
    "msal>=1.30",
    "keyring>=25",
    "httpx>=0.27",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
]

[project.scripts]
mcp-mail = "mcp_mail.__main__:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT", "TID"]
ignore = ["E501"]
